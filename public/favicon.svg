<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DD9D"/>
      <stop offset="50%" stop-color="#C9A24D"/>
      <stop offset="100%" stop-color="#9E792D"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E382E"/>
      <stop offset="50%" stop-color="#0A261F"/>
      <stop offset="100%" stop-color="#051410"/>
    </linearGradient>
  </defs>
  <!-- Background with Gold Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <!-- Inner Delicate Line -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4"/>
  <!-- KS Monogram Text -->
  <text x="32" y="42" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="27" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">KS</text>
</svg>
